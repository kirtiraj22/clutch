[package]
name = "clutch"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
bincode = "1.3.3"
bs58 = "0.5.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
hex = "0.4.3"
jsonrpsee = { version = "0.26", features = ["server", "macros"] }
serde = "1.0.228"
serde_json = "1.0.150"
sha2 = "0.11.0"
solana-client = "2.1.0"
solana-commitment-config = "2.1.0"
solana-sdk = "2.0.1"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "signal"] }
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
